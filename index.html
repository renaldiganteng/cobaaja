<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sedang Maintenance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 520px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid #475569;
      border-radius: 999px;
      font-size: 0.875rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon" aria-hidden="true">🛠️</div>
    <h1>Sedang Maintenance</h1>
    <p>
      Situs ini sedang dalam perbaikan. Kami akan segera kembali.
      Terima kasih atas kesabaran Anda.
    </p>
    <span class="badge">Harap kembali beberapa saat lagi</span>
  </main>
</body>
</html>
